[project]
name = "scholar-agents"
version = "0.1.0"
description = "scholars-ai agent runtime: self-built loop + dual-protocol ModelProvider"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "anthropic>=0.40",
    "openai>=1.55",
    "pydantic>=2.9",
    "pyyaml>=6.0",
    "psycopg[binary,pool]>=3.2",
    "structlog>=24.4",
    "jsonschema>=4.23",
    "scholar-contracts",
    "feedparser>=6.0.14",
    "trafilatura>=2.2.0",
    "httpx>=0.28.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "mypy>=1.13",
    "ruff>=0.8",
    "types-pyyaml",
    "types-jsonschema>=4.26.0.20260518",
]

[tool.uv.sources]
scholar-contracts = { git = "https://github.com/scholars-ai/scholar-shared", subdirectory = "gen/python" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/scholar_agents"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
strict = true
packages = ["scholar_agents"]
mypy_path = "src"

[[tool.mypy.overrides]]
# feedparser 无类型标注（无 py.typed）；它的返回值我们已在 fetcher 内部做了防御性取值
module = ["feedparser", "trafilatura", "scholar_contracts.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
